

services:
  # ─── MySQL Database ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: disasterlink-db
    environment:
      # FIX H3: Passwords come from .env file, not hardcoded here
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: disasterlink_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - disasterlink-net
    restart: unless-stopped

  # ─── Spring Boot Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disasterlink-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/disasterlink_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      # FIX H3: DB password from .env
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-cosmosjayeshspaceastroidcometput233241}
      # FIX H1: Explicit frontend origin for CORS (adjust for your domain in prod)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      # FIX C1: Gemini API key from .env — never hardcoded
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-disasterlink-sos-alerts}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - disasterlink-net
    restart: unless-stopped

  # ─── Angular Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disasterlink-ui
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - disasterlink-net
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  disasterlink-net:
    driver: bridge