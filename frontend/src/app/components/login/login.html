<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-badge mx-auto mb-3">
            <i class="bi bi-shield-lock-fill text-primary fs-2"></i>
          </div>
          <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
          <p class="text-muted small">Access the DisasterLink v2.0 Platform</p>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger p-2 small text-center mb-3">
          {{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label text-light small fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-dark text-muted border-secondary"><i class="bi bi-person"></i></span>
              <input
                type="text"
                class="form-control bg-dark text-light border-secondary"
                placeholder="Enter username"
                formControlName="username"
              />
            </div>
            <div *ngIf="f['username'].touched && f['username'].errors" class="text-danger small mt-1">
              Username is required.
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-light small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-dark text-muted border-secondary"><i class="bi bi-key"></i></span>
              <input
                type="password"
                class="form-control bg-dark text-light border-secondary"
                placeholder="Enter password"
                formControlName="password"
              />
            </div>
            <div *ngIf="f['password'].touched && f['password'].errors" class="text-danger small mt-1">
              Password is required.
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary w-100 py-2 rounded-3 fw-bold"
            [disabled]="isSubmitting"
          >
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
            {{ isSubmitting ? 'Authenticating...' : 'Sign In' }}
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-dark-subtle">
          <span class="text-muted small">Don't have an account? </span>
          <a routerLink="/register" class="text-primary small fw-bold text-decoration-none">Register here</a>
        </div>
      </div>
    </div>
  </div>
</div>
