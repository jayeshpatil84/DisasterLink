<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-dark-subtle sticky-top custom-navbar">
  <div class="container-fluid px-4">
    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-2 font-weight-bold" routerLink="/">
      <div class="brand-icon">
        <i class="bi bi-shield-fill-exclamation text-danger fs-4"></i>
      </div>
      <span class="brand-title">Disaster<span class="text-primary">Link</span></span>
      <span class="version-badge">v2.0</span>
    </a>

    <!-- Mobile Toggle -->
    <button
      class="navbar-toggler border-0"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarContent"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <!-- Left nav links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
        <!-- Officer Navigation -->
        <ng-container *ngIf="authService.isOfficer()">
          <li class="nav-item">
            <a class="nav-link px-3" routerLink="/officer/dashboard" routerLinkActive="active">
              <i class="bi bi-broadcast me-1 text-danger"></i> Command Center
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-3" routerLink="/reports" routerLinkActive="active">
              <i class="bi bi-list-task me-1"></i> SOS Incidents
            </a>
          </li>
        </ng-container>

        <!-- Volunteer Navigation -->
        <ng-container *ngIf="authService.isVolunteer()">
          <li class="nav-item">
            <a class="nav-link px-3" routerLink="/volunteer/dashboard" routerLinkActive="active">
              <i class="bi bi-person-badge me-1 text-success"></i> My Assigned Tasks
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-3" routerLink="/reports" routerLinkActive="active">
              <i class="bi bi-list-task me-1"></i> Live Incidents
            </a>
          </li>
        </ng-container>

        <!-- Victim Navigation -->
        <ng-container *ngIf="authService.isVictim()">
          <li class="nav-item">
            <a class="nav-link px-3" routerLink="/victim/my-sos" routerLinkActive="active">
              <i class="bi bi-shield-exclamation me-1 text-danger"></i> My SOS Requests
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-3 text-warning font-weight-semibold" routerLink="/reports/new" routerLinkActive="active">
              <i class="bi bi-lightning-charge-fill me-1"></i> Submit SOS
            </a>
          </li>
        </ng-container>

        <!-- Fallback if not logged in -->
        <ng-container *ngIf="!authService.isLoggedIn()">
          <li class="nav-item">
            <a class="nav-link px-3" routerLink="/dashboard" routerLinkActive="active">
              <i class="bi bi-speedometer2 me-1"></i> Public Feed
            </a>
          </li>
        </ng-container>
      </ul>

      <!-- Right authentication links -->
      <div class="d-flex align-items-center gap-3">
        <ng-container *ngIf="authService.isLoggedIn(); else loggedOut">
          <div class="user-pill d-flex align-items-center gap-2 px-3 py-1 border rounded-pill">
            <i class="bi bi-person-circle text-info"></i>
            <span class="username-text fw-medium">{{ authService.getUsername() }}</span>
            <span
              class="badge text-uppercase"
              [ngClass]="{
                'bg-danger': authService.isOfficer(),
                'bg-success': authService.isVolunteer(),
                'bg-secondary': authService.isVictim()
              }"
            >
              {{ authService.getRole() }}
            </span>
          </div>

          <button class="btn btn-outline-danger btn-sm rounded-pill px-3" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </ng-container>

        <ng-template #loggedOut>
          <a routerLink="/login" class="btn btn-outline-light btn-sm rounded-pill px-3">
            Log In
          </a>
          <a routerLink="/register" class="btn btn-primary btn-sm rounded-pill px-3">
            Register
          </a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
