<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-badge mx-auto mb-3">
            <i class="bi bi-person-plus-fill text-success fs-2"></i>
          </div>
          <h3 class="fw-bold text-white mb-1">Create Account</h3>
          <p class="text-muted small">Join DisasterLink Emergency Response Network</p>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger p-2 small text-center mb-3">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="alert alert-success p-2 small text-center mb-3">
          {{ successMessage }}
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <!-- Account Type / Role -->
          <div class="mb-3">
            <label class="form-label text-light small fw-semibold">I want to register as a:</label>
            <div class="row g-2">
              <div class="col-6">
                <input
                  type="radio"
                  class="btn-check"
                  name="role"
                  id="roleVictim"
                  value="VICTIM"
                  formControlName="role"
                />
                <label class="btn btn-outline-secondary w-100 py-2 small" for="roleVictim">
                  <i class="bi bi-person-exclamation me-1 text-warning"></i> Victim / Citizen
                </label>
              </div>
              <div class="col-6">
                <input
                  type="radio"
                  class="btn-check"
                  name="role"
                  id="roleVolunteer"
                  value="VOLUNTEER"
                  formControlName="role"
                />
                <label class="btn btn-outline-secondary w-100 py-2 small" for="roleVolunteer">
                  <i class="bi bi-heart-pulse me-1 text-success"></i> Volunteer
                </label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-light small fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-dark text-muted border-secondary"><i class="bi bi-person"></i></span>
              <input
                type="text"
                class="form-control bg-dark text-light border-secondary"
                placeholder="Choose username"
                formControlName="username"
              />
            </div>
            <div *ngIf="f['username'].touched && f['username'].errors" class="text-danger small mt-1">
              Username must be at least 3 characters.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-light small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-dark text-muted border-secondary"><i class="bi bi-envelope"></i></span>
              <input
                type="email"
                class="form-control bg-dark text-light border-secondary"
                placeholder="name@example.com"
                formControlName="email"
              />
            </div>
            <div *ngIf="f['email'].touched && f['email'].errors" class="text-danger small mt-1">
              Valid email address is required.
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-light small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-dark text-muted border-secondary"><i class="bi bi-key"></i></span>
              <input
                type="password"
                class="form-control bg-dark text-light border-secondary"
                placeholder="At least 6 characters"
                formControlName="password"
              />
            </div>
            <div *ngIf="f['password'].touched && f['password'].errors" class="text-danger small mt-1">
              Password must be at least 6 characters.
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-success w-100 py-2 rounded-3 fw-bold"
            [disabled]="isSubmitting"
          >
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
            {{ isSubmitting ? 'Creating Account...' : 'Register Account' }}
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-dark-subtle">
          <span class="text-muted small">Already registered? </span>
          <a routerLink="/login" class="text-success small fw-bold text-decoration-none">Sign in here</a>
        </div>
      </div>
    </div>
  </div>
</div>
