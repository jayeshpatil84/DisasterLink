
# ===== Application =====
spring.application.name=disasterlink-backend
server.port=8080

# ===== MySQL Database =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disasterlink_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JSON =====
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== JWT =====
jwt.secret=${JWT_SECRET:cosmosjayeshspaceastroidcometput233241}
jwt.expiration-ms=86400000

# ===== CORS =====
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===== Google Gemini AI =====
gemini.api-key=${GEMINI_API_KEY:}

# ===== ntfy.sh Push Notifications =====
ntfy.topic=${NTFY_TOPIC:disasterlink-sos-alerts}
ntfy.base-url=https://ntfy.sh

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===== Logging =====
logging.level.org.springframework.web=INFO
logging.level.com.disasterlink=DEBUG

