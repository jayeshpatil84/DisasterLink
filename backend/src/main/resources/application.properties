
# ===== Application =====
spring.application.name=disasterlink-backend
server.port=8080

# ===== MySQL Database =====
# Default values work for local dev. Docker Compose overrides these via env vars.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disasterlink_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JSON =====
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== JWT =====
# CRITICAL: jwt.secret MUST be supplied via the JWT_SECRET environment variable.
# The fallback below is ONLY for local development convenience.
# In production/Docker always set JWT_SECRET in .env or docker-compose.yml.
# Minimum 32 characters. Generate with: openssl rand -hex 32
jwt.secret=${JWT_SECRET:cosmosjayeshspaceastroidcometput233241}
jwt.expiration-ms=86400000

# ===== CORS =====
# Comma-separated list of allowed origins. Override per environment.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===== Google Gemini AI =====
# Get a free API key at https://aistudio.google.com/
# Leave blank to use the rule-based fallback (app works without it).
# NEVER commit the actual key here — supply via env var or Docker secret.
# SECURITY WARNING: Replace with your own key from https://aistudio.google.com/
# Never commit real API keys to version control. Use env var GEMINI_API_KEY in production.
gemini.api-key=${GEMINI_API_KEY:}

# ===== ntfy.sh Push Notifications =====
# Change the topic to something unique (e.g., disasterlink-sos-yourname)
# so you don't get alerts from other DisasterLink instances.
ntfy.topic=${NTFY_TOPIC:disasterlink-sos-alerts}
ntfy.base-url=https://ntfy.sh

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===== Logging =====
logging.level.org.springframework.web=INFO
logging.level.com.disasterlink=DEBUG

